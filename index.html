<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ye ghadi chaljayegi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; background: #0c0b0a; }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 3rem;
      padding: 2rem;
    }

    .fade-1 { animation: fadeUp 1.4s cubic-bezier(0.22,1,0.36,1) both; }
    .fade-2 { animation: fadeUp 1.4s 0.2s cubic-bezier(0.22,1,0.36,1) both; }
    .fade-3 { animation: fadeUp 1.4s 0.4s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 300;
      font-size: clamp(2rem, 6vw, 4.2rem);
      color: #e8e0d4;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .clock-wrap {
      width: clamp(200px, 44vw, 290px);
      aspect-ratio: 1;
      filter: drop-shadow(0 12px 40px rgba(0,0,0,0.8));
    }
    .clock-wrap svg { width: 100%; height: 100%; }

    button.main-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.92rem;
      font-weight: 400;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: #c8bfb0;
      background: transparent;
      border: 1px solid #3a3530;
      padding: 0.72rem 2.8rem;
      cursor: pointer;
      border-radius: 2px;
      transition: background 0.3s, border-color 0.3s, color 0.3s, transform 0.12s;
    }
    button.main-btn:hover { background: #c9b99a; border-color: #c9b99a; color: #0c0b0a; }
    button.main-btn:active { transform: scale(0.97); }

    /* QR Modal */
    #qr-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 100;
      animation: overlayIn 0.3s ease both;
    }
    #qr-overlay.active { display: flex; }
    @keyframes overlayIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    .qr-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      animation: cardIn 0.35s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.88) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    .qr-card img { width: clamp(240px, 70vw, 360px); border-radius: 18px; display: block; }
    .qr-hint {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: #6a6258;
    }
    .qr-close {
      position: absolute;
      top: -14px; right: -14px;
      width: 32px; height: 32px;
      border-radius: 50%;
      background: #1e1c19;
      border: 1px solid #3a3530;
      color: #c8bfb0;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: background 0.2s, color 0.2s;
      padding: 0;
      letter-spacing: 0;
      text-transform: none;
    }
    .qr-close:hover { background: #c9b99a; color: #0c0b0a; border-color: #c9b99a; }

    /* Autoplay unlock screen — shown if browser blocks autoplay */
    #unlock-screen {
      display: none;
      position: fixed;
      inset: 0;
      background: #0c0b0a;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      z-index: 200;
    }
    #unlock-screen.visible { display: flex; }
    #unlock-screen p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: clamp(1.2rem, 4vw, 2rem);
      color: #e8e0d4;
      letter-spacing: 0.05em;
      text-align: center;
      padding: 0 1rem;
    }
    #unlock-btn {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.9rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #0c0b0a;
      background: #c9b99a;
      border: none;
      padding: 0.8rem 3rem;
      border-radius: 2px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    #unlock-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>

  <!-- Hidden audio — loops forever, no controls -->
  <audio id="bg-audio" loop preload="auto">
